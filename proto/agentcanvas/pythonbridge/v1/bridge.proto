syntax = "proto3";

package agentcanvas.pythonbridge.v1;

option go_package = "agentcanvas/internal/infrastructure/pythonbridge/gen;pythonbridge";

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string service_version = 2;
  string protocol_version = 3;
  string message = 4;
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  string protocol_version = 1;
  string service_version = 2;
  repeated string chunk_methods = 3;
  reserved 4;
  uint32 max_concurrency = 5;
  uint64 max_input_bytes = 6;
  uint64 max_output_bytes = 7;
  repeated string parser_methods = 8;
}

message DocumentBlock {
  string id = 1;
  string type = 2;
  string text = 3;
  optional int32 page_no = 4;
  string bbox_json = 5;
  string metadata_json = 6;
}

message ParsedDocument {
  string text = 1;
  string file_type = 2;
  repeated DocumentBlock blocks = 3;
}

message ParseDocumentRequest {
  string request_id = 1;
  string filename = 2;
  string parser = 3;
  bytes content = 4;
}

message ParseDocumentResponse {
  ParsedDocument document = 1;
  string parser = 2;
  string implementation_version = 3;
  bool requires_ocr = 4;
  repeated string warnings = 5;
}

message ChunkPolicy {
  int32 chunk_size = 1;
  int32 overlap = 2;
}

message ChunkDocumentRequest {
  string request_id = 1;
  string method = 2;
  ParsedDocument document = 3;
  ChunkPolicy policy = 4;
}

message Chunk {
  int32 index = 1;
  string content = 2;
  int32 token_count = 3;
  int32 char_count = 4;
  string section_title = 5;
  optional int32 page_no = 6;
  string metadata_json = 7;
}

message ChunkDocumentResponse {
  repeated Chunk chunks = 1;
  string algorithm = 2;
  string tokenizer = 3;
  string implementation_version = 4;
}

service PythonBridge {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc ParseDocument(ParseDocumentRequest) returns (ParseDocumentResponse);
  rpc ChunkDocument(ChunkDocumentRequest) returns (ChunkDocumentResponse);
}
