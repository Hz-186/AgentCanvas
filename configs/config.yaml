app:
  name: agentcanvas
  env: docker
  port: 8080
  base_url: http://localhost:8080

mysql:
  dsn: root:password@tcp(mysql:3306)/agentcanvas?charset=utf8mb4&parseTime=True&loc=Local
  max_open_conns: 20
  max_idle_conns: 10

redis:
  addr: redis:6379
  password: ""
  db: 0

queue:
  backend: nats
  redis_stream: agentcanvas:jobs
  redis_group: agentcanvas-workers
  redis_consumer: worker

llm_cache:
  enabled: true
  l1_enabled: true
  l2_enabled: true
  similarity_threshold: 0.96
  ttl_seconds: 86400
  embedding_provider_id: 1
  embedding_model: text-embedding-v3

memory_dream:
  enabled: true
  trigger_every_n_turns: 5
  idle_timeout_seconds: 180
  llm_provider_type: openai_compatible
  llm_base_url: ""
  llm_api_key: ""
  llm_model: deepseek-chat

nats:
  url: nats://nats:4222
  stream: AGENTCANVAS_INGESTION
  subject: agentcanvas.ingestion
  consumer: agentcanvas-workers
  durable: agentcanvas-workers
  ack_wait_seconds: 60

minio:
  endpoint: minio:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: agentcanvas
  use_ssl: false

elasticsearch:
  addresses:
    - http://elasticsearch:9200
  username: ""
  password: ""
  chunk_index: agentcanvas_chunks_v1

milvus:
  enabled: true
  address: http://milvus:19530
  token: ""
  collection: agentcanvas_chunks
  dimensions: 0
  m: 16
  ef_construction: 200
  ef_search: 64
  metric_type: COSINE

ocr:
  enabled: false
  endpoint: http://deepdoc:8000/ocr
  token: ""
  timeout_seconds: 60

security:
  jwt_secret: change-this-docker-jwt-secret
  refresh_token_pepper: change-this-docker-refresh-pepper
  secret_encrypt_key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  access_token_ttl_minutes: 30
  refresh_token_ttl_days: 20

oauth:
  github:
    client_id: ""
    client_secret: ""
    redirect_url: http://localhost:8080/api/v1/auth/github/callback
    scopes:
      - read:user
      - user:email
