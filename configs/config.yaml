app:
  name: agentcanvas
  env: docker
  port: 8080
  base_url: http://localhost:8080

mysql:
  dsn: root:password@tcp(mysql:3306)/agentcanvas?charset=utf8mb4&parseTime=True&loc=Local
  max_open_conns: 20
  max_idle_conns: 10

redis:
  addr: redis:6379
  password: ""
  db: 0

queue:
  backend: nats
  redis_stream: agentcanvas:jobs
  redis_group: agentcanvas-workers
  redis_consumer: worker

llm_cache:
  enabled: true
  l1_enabled: true
  l2_enabled: true
  similarity_threshold: 0.96
  ttl_seconds: 86400
  embedding_provider_id: 1
  embedding_model: text-embedding-v3

resource_cache:
  enabled: true
  key_prefix: agentcanvas
  ttl_seconds: 60

memory_dream:
  enabled: true
  trigger_every_n_turns: 5
  idle_timeout_seconds: 180
  llm_provider_type: openai_compatible
  llm_base_url: ""
  llm_api_key: ""
  llm_model: deepseek-chat

nats:
  url: nats://nats:4222
  stream: AGENTCANVAS_INGESTION
  subject: agentcanvas.ingestion
  consumer: agentcanvas-workers
  durable: agentcanvas-workers
  ack_wait_seconds: 60

reflection_queue:
  backend: mysql
  stream: AGENTCANVAS_REFLECTION
  subject: agentcanvas.reflection.jobs
  dlq_stream: AGENTCANVAS_REFLECTION_DLQ
  dlq_subject: agentcanvas.reflection.dlq
  durable: reflection-workers
  ack_wait_seconds: 120
  heartbeat_seconds: 30
  lease_seconds: 180
  concurrency: 2
  max_ack_pending: 2
  outbox_batch_size: 100
  outbox_poll_milliseconds: 500
  stream_max_age_days: 30
  stream_max_bytes: 1073741824
  stream_replicas: 1

agent_runtime:
  worker_enabled: true
  worker_concurrency: 2
  lease_seconds: 30
  workspace_enabled: false
  workspace_allowed_roots: []
  workspace_docker_image: agentcanvas/workspace:latest
  self_improvement_enabled: true
  memory_review_mode: suggest
  review_worker_concurrency: 1
  review_provider_id: 0
  review_model: ""

minio:
  endpoint: minio:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: agentcanvas
  use_ssl: false

elasticsearch:
  addresses:
    - http://elasticsearch:9200
  username: ""
  password: ""
  chunk_index: agentcanvas_chunks_v1
  message_index: agentcanvas_messages_v1
  context_index: agentcanvas_context_resources_v1

milvus:
  enabled: true
  address: http://milvus:19530
  token: ""
  collection: agentcanvas_chunks
  dimensions: 0
  m: 16
  ef_construction: 200
  ef_search: 64
  metric_type: COSINE

context_index:
  enabled: true
  worker_enabled: true
  embedding_provider_id: 0
  embedding_model: ""
  batch_size: 50
  poll_milliseconds: 1000
  lease_seconds: 60

ocr:
  enabled: false
  endpoint: http://deepdoc:8000/ocr
  token: ""
  timeout_seconds: 60

security:
  jwt_secret: change-this-docker-jwt-secret
  refresh_token_pepper: change-this-docker-refresh-pepper
  secret_encrypt_key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  access_token_ttl_minutes: 30
  refresh_token_ttl_days: 20

oauth:
  github:
    client_id: ""
    client_secret: ""
    redirect_url: http://localhost:8080/api/v1/auth/github/callback
    scopes:
      - read:user
      - user:email
