[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcanvas-python-bridge"
version = "0.1.0"
description = "Python capability sidecar for AgentCanvas"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.66.2,<2",
  "protobuf>=5.27.2,<6",
  "langchain-core>=1,<2",
  "langchain-community>=0.4,<0.5",
  "langchain-text-splitters>=1,<2",
  "pymupdf>=1.24,<2",
]

[tool.setuptools.packages.find]
where = ["."]
