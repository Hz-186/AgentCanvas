services:
  api:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: agentcanvas-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AGENTCANVAS_CONFIG_PATH: /app/configs/config.yaml
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
