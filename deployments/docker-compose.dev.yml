services:
  migrate:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: agentcanvas-migrate
    restart: "no"
    command: ["/app/migrate"]
    environment:
      AGENTCANVAS_CONFIG_PATH: /app/configs/config.yaml
      AGENTCANVAS_JWT_SECRET: ${AGENTCANVAS_JWT_SECRET:?Set AGENTCANVAS_JWT_SECRET}
      AGENTCANVAS_REFRESH_TOKEN_PEPPER: ${AGENTCANVAS_REFRESH_TOKEN_PEPPER:?Set AGENTCANVAS_REFRESH_TOKEN_PEPPER}
      AGENTCANVAS_SECRET_ENCRYPT_KEY: ${AGENTCANVAS_SECRET_ENCRYPT_KEY:?Set AGENTCANVAS_SECRET_ENCRYPT_KEY}
      AGENTCANVAS_MYSQL_DSN: ${AGENTCANVAS_MYSQL_DSN:?Set AGENTCANVAS_MYSQL_DSN}
      AGENTCANVAS_REDIS_PASSWORD: ${AGENTCANVAS_REDIS_PASSWORD:?Set AGENTCANVAS_REDIS_PASSWORD}
      AGENTCANVAS_MINIO_ACCESS_KEY: ${AGENTCANVAS_MINIO_ACCESS_KEY:?Set AGENTCANVAS_MINIO_ACCESS_KEY}
      AGENTCANVAS_MINIO_SECRET_KEY: ${AGENTCANVAS_MINIO_SECRET_KEY:?Set AGENTCANVAS_MINIO_SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: agentcanvas-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AGENTCANVAS_CONFIG_PATH: /app/configs/config.yaml
      AGENTCANVAS_JWT_SECRET: ${AGENTCANVAS_JWT_SECRET:?Set AGENTCANVAS_JWT_SECRET}
      AGENTCANVAS_REFRESH_TOKEN_PEPPER: ${AGENTCANVAS_REFRESH_TOKEN_PEPPER:?Set AGENTCANVAS_REFRESH_TOKEN_PEPPER}
      AGENTCANVAS_SECRET_ENCRYPT_KEY: ${AGENTCANVAS_SECRET_ENCRYPT_KEY:?Set AGENTCANVAS_SECRET_ENCRYPT_KEY}
      AGENTCANVAS_MYSQL_DSN: ${AGENTCANVAS_MYSQL_DSN:?Set AGENTCANVAS_MYSQL_DSN}
      AGENTCANVAS_REDIS_PASSWORD: ${AGENTCANVAS_REDIS_PASSWORD:?Set AGENTCANVAS_REDIS_PASSWORD}
      AGENTCANVAS_MINIO_ACCESS_KEY: ${AGENTCANVAS_MINIO_ACCESS_KEY:?Set AGENTCANVAS_MINIO_ACCESS_KEY}
      AGENTCANVAS_MINIO_SECRET_KEY: ${AGENTCANVAS_MINIO_SECRET_KEY:?Set AGENTCANVAS_MINIO_SECRET_KEY}
      AGENTCANVAS_PYTHON_BRIDGE_TOKEN: ${AGENTCANVAS_PYTHON_BRIDGE_TOKEN:-local-dev-python-bridge-token}
    volumes:
      # Set AGENTCANVAS_WORKSPACE_ROOT to one absolute host directory shared by API, worker, and pruner.
      # Project paths stored in Docker must use the matching container prefix: /workspaces/<repo>.
      - ${AGENTCANVAS_WORKSPACE_ROOT:?Set AGENTCANVAS_WORKSPACE_ROOT to an absolute host repository root}:/workspaces
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      python-bridge:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      nats:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: agentcanvas-worker
    restart: unless-stopped
    command: ["/app/worker"]
    environment:
      AGENTCANVAS_CONFIG_PATH: /app/configs/config.yaml
      AGENTCANVAS_JWT_SECRET: ${AGENTCANVAS_JWT_SECRET:?Set AGENTCANVAS_JWT_SECRET}
      AGENTCANVAS_REFRESH_TOKEN_PEPPER: ${AGENTCANVAS_REFRESH_TOKEN_PEPPER:?Set AGENTCANVAS_REFRESH_TOKEN_PEPPER}
      AGENTCANVAS_SECRET_ENCRYPT_KEY: ${AGENTCANVAS_SECRET_ENCRYPT_KEY:?Set AGENTCANVAS_SECRET_ENCRYPT_KEY}
      AGENTCANVAS_MYSQL_DSN: ${AGENTCANVAS_MYSQL_DSN:?Set AGENTCANVAS_MYSQL_DSN}
      AGENTCANVAS_REDIS_PASSWORD: ${AGENTCANVAS_REDIS_PASSWORD:?Set AGENTCANVAS_REDIS_PASSWORD}
      AGENTCANVAS_MINIO_ACCESS_KEY: ${AGENTCANVAS_MINIO_ACCESS_KEY:?Set AGENTCANVAS_MINIO_ACCESS_KEY}
      AGENTCANVAS_MINIO_SECRET_KEY: ${AGENTCANVAS_MINIO_SECRET_KEY:?Set AGENTCANVAS_MINIO_SECRET_KEY}
      AGENTCANVAS_PYTHON_BRIDGE_TOKEN: ${AGENTCANVAS_PYTHON_BRIDGE_TOKEN:-local-dev-python-bridge-token}
    volumes:
      - ${AGENTCANVAS_WORKSPACE_ROOT:?Set AGENTCANVAS_WORKSPACE_ROOT to an absolute host repository root}:/workspaces
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      python-bridge:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      nats:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  agent-worker:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: agentcanvas-agent-worker
    restart: unless-stopped
    command: ["/app/worker"]
    environment:
      AGENTCANVAS_CONFIG_PATH: /app/configs/config.yaml
      AGENTCANVAS_JWT_SECRET: ${AGENTCANVAS_JWT_SECRET:?Set AGENTCANVAS_JWT_SECRET}
      AGENTCANVAS_REFRESH_TOKEN_PEPPER: ${AGENTCANVAS_REFRESH_TOKEN_PEPPER:?Set AGENTCANVAS_REFRESH_TOKEN_PEPPER}
      AGENTCANVAS_SECRET_ENCRYPT_KEY: ${AGENTCANVAS_SECRET_ENCRYPT_KEY:?Set AGENTCANVAS_SECRET_ENCRYPT_KEY}
      AGENTCANVAS_WORKER_ROLE: agent
      AGENTCANVAS_MYSQL_DSN: ${AGENTCANVAS_MYSQL_DSN:?Set AGENTCANVAS_MYSQL_DSN}
      AGENTCANVAS_REDIS_PASSWORD: ${AGENTCANVAS_REDIS_PASSWORD:?Set AGENTCANVAS_REDIS_PASSWORD}
      AGENTCANVAS_MINIO_ACCESS_KEY: ${AGENTCANVAS_MINIO_ACCESS_KEY:?Set AGENTCANVAS_MINIO_ACCESS_KEY}
      AGENTCANVAS_MINIO_SECRET_KEY: ${AGENTCANVAS_MINIO_SECRET_KEY:?Set AGENTCANVAS_MINIO_SECRET_KEY}
      AGENTCANVAS_PYTHON_BRIDGE_TOKEN: ${AGENTCANVAS_PYTHON_BRIDGE_TOKEN:-local-dev-python-bridge-token}
    volumes:
      - ${AGENTCANVAS_WORKSPACE_ROOT:?Set AGENTCANVAS_WORKSPACE_ROOT to an absolute host repository root}:/workspaces
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      python-bridge:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      nats:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  workspace-pruner:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: agentcanvas-workspace-pruner
    restart: unless-stopped
    command: ["/app/workspace-pruner"]
    environment:
      AGENTCANVAS_CONFIG_PATH: /app/configs/config.yaml
      AGENTCANVAS_JWT_SECRET: ${AGENTCANVAS_JWT_SECRET:?Set AGENTCANVAS_JWT_SECRET}
      AGENTCANVAS_REFRESH_TOKEN_PEPPER: ${AGENTCANVAS_REFRESH_TOKEN_PEPPER:?Set AGENTCANVAS_REFRESH_TOKEN_PEPPER}
      AGENTCANVAS_SECRET_ENCRYPT_KEY: ${AGENTCANVAS_SECRET_ENCRYPT_KEY:?Set AGENTCANVAS_SECRET_ENCRYPT_KEY}
      AGENTCANVAS_MYSQL_DSN: ${AGENTCANVAS_MYSQL_DSN:?Set AGENTCANVAS_MYSQL_DSN}
      AGENTCANVAS_REDIS_PASSWORD: ${AGENTCANVAS_REDIS_PASSWORD:?Set AGENTCANVAS_REDIS_PASSWORD}
      AGENTCANVAS_MINIO_ACCESS_KEY: ${AGENTCANVAS_MINIO_ACCESS_KEY:?Set AGENTCANVAS_MINIO_ACCESS_KEY}
      AGENTCANVAS_MINIO_SECRET_KEY: ${AGENTCANVAS_MINIO_SECRET_KEY:?Set AGENTCANVAS_MINIO_SECRET_KEY}
    volumes:
      - ${AGENTCANVAS_WORKSPACE_ROOT:?Set AGENTCANVAS_WORKSPACE_ROOT to an absolute host repository root}:/workspaces
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
